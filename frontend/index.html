<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a56a0">
    <meta name="description" content="Ask the Campus Helpdesk about college life, student services, and academics.">
    <title>Campus Helpdesk</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <section class="chat-card" aria-label="Campus Helpdesk student helpdesk">
        <header class="chat-header">
            <div class="logo">🎓</div>
            <div class="brand-copy">
                <h1>Campus Helpdesk</h1>
                <p>Student Helpdesk</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme">
                <span aria-hidden="true">☾</span>
            </button>
            <div id="connection-status" class="connection-status checking" role="status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="connection-label">Checking</span>
            </div>
        </header>

        <main class="chat-messages" id="chatBox" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Chat messages">
            <article class="message-row bot-row">
                <div class="message bot-message">
                    <p>Hello! 👋 Welcome to Campus Helpdesk.</p>
                    <p>I am your campus helpdesk assistant.<br>Ask me anything about college life and student services.</p>
                    <time class="message-time"></time>
                </div>
            </article>

            <section class="faq-section" aria-labelledby="faq-heading">
                <h2 class="quick-title" id="faq-heading">Frequently Asked Questions</h2>
                <div id="quick-replies" class="quick-buttons" aria-label="Quick questions"></div>
            </section>

            <div id="typing-indicator" class="message-row bot-row typing-row" aria-label="Campus Helpdesk is typing" hidden>
                <div class="typing-bubble" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </main>

        <form class="chat-footer" id="chat-form">
            <label class="visually-hidden" for="message-input">Your question</label>
            <input
                type="text"
                id="message-input"
                name="message"
                maxlength="2000"
                autocomplete="off"
                placeholder="Type your question here..."
                required
            >
            <button type="submit" id="send-button">Send <span aria-hidden="true">➤</span></button>
        </form>
    </section>
</body>
</html>
